# =============================================================================
# .gitlab-ci.yml -- Pipeline Flutter Web
# Deploy test et prod via SSH + notification SMS
# NOTIF : envoyee a TOUS les numeros de USER_PHONE_MAP
# -----------------------------------------------------------------------------
# USER_PHONE_MAP format : email1:numero1,email2:numero2,...
# Exemple : alioune.diouf@yas.sn:760158277,fatou.diop@yas.sn:770123456
# =============================================================================

variables:
  DEPLOY_SCRIPT: "/var/www/b2b-css-front/deploy.sh"
  SMS_API_URL: "https://192.168.41.45:9040/services/SendNotifications.aspx"
  SMS_API_SENDER: "B2BSelf-CI"
  SMS_RECIPIENTS: "768095469"   # fallback si USER_PHONE_MAP est vide

stages:
  - deploy

# =============================================================================
# DEPLOY TEST -- branche main, declenchement AUTOMATIQUE
# =============================================================================
deploy:test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY_TEST" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-add ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST_TEST" >> ~/.ssh/known_hosts
  script:
    - echo "Deploiement sur serveur TEST ($DEPLOY_HOST_TEST)..."
    - ssh -o StrictHostKeyChecking=no "root@$DEPLOY_HOST_TEST" "GIT_BRANCH=${CI_COMMIT_BRANCH} bash $DEPLOY_SCRIPT" || true
    - echo "Deploy TEST termine avec succes !"
  environment:
    name: test
    url: https://test.votre-app.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        MESSAGE="[Flutter Web] Deploy TEST OK - Pipeline #$CI_PIPELINE_ID (commit par $CI_COMMIT_AUTHOR)"
      else
        MESSAGE="[Flutter Web] Deploy TEST FAILED - Pipeline #$CI_PIPELINE_ID (commit par $CI_COMMIT_AUTHOR)"
      fi

      # --- Envoi a tous les numeros de USER_PHONE_MAP ---
      if [ -n "${USER_PHONE_MAP:-}" ]; then
        ALL_PHONES=$(echo "$USER_PHONE_MAP" | tr ',' '\n' | cut -d':' -f2 | tr '\n' ',')
      else
        ALL_PHONES="$SMS_RECIPIENTS"
      fi

      echo "Envoi SMS a : $ALL_PHONES"
      for PHONE in $(echo "$ALL_PHONES" | tr ',' ' '); do
        [ -z "$PHONE" ] && continue
        curl -sk -X POST "$SMS_API_URL" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -d "{\"messageToSend\":\"$MESSAGE\",\"receiverMSISDN\":\"$PHONE\",\"sender\":\"$SMS_API_SENDER\",\"type\":0}" || true
      done

# =============================================================================
# DEPLOY PRODUCTION -- branche main, declenchement MANUEL
# =============================================================================
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-add ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST_PROD" >> ~/.ssh/known_hosts
  script:
    - echo "Deploiement sur serveur PROD ($DEPLOY_HOST_PROD)..."
    - ssh -o StrictHostKeyChecking=no "root@$DEPLOY_HOST_PROD" "GIT_BRANCH=${CI_COMMIT_BRANCH} bash $DEPLOY_SCRIPT" || true
    - echo "Deploy PROD termine avec succes !"
  environment:
    name: production
    url: https://votre-app.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        MESSAGE="[Flutter Web] Deploy PROD OK - Pipeline #$CI_PIPELINE_ID (commit par $CI_COMMIT_AUTHOR)"
      else
        MESSAGE="[Flutter Web] Deploy PROD FAILED - Pipeline #$CI_PIPELINE_ID (commit par $CI_COMMIT_AUTHOR)"
      fi

      # --- Envoi a tous les numeros de USER_PHONE_MAP ---
      if [ -n "${USER_PHONE_MAP:-}" ]; then
        ALL_PHONES=$(echo "$USER_PHONE_MAP" | tr ',' '\n' | cut -d':' -f2 | tr '\n' ',')
      else
        ALL_PHONES="$SMS_RECIPIENTS"
      fi

      echo "Envoi SMS a : $ALL_PHONES"
      for PHONE in $(echo "$ALL_PHONES" | tr ',' ' '); do
        [ -z "$PHONE" ] && continue
        curl -sk -X POST "$SMS_API_URL" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -d "{\"messageToSend\":\"$MESSAGE\",\"receiverMSISDN\":\"$PHONE\",\"sender\":\"$SMS_API_SENDER\",\"type\":0}" || true
      done