# =============================================================================
# .gitlab-ci.yml -- Pipeline Flutter Web
# Le CI se connecte en SSH et lance deploy.sh sur le serveur
# =============================================================================

stages:
  - deploy

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/id_ed25519 \
          -o StrictHostKeyChecking=no \
          root@${DEPLOY_HOST} \
          "GIT_BRANCH=${CI_COMMIT_BRANCH} bash /var/www/b2b-css-front/deploy.sh"
  environment:
    name: production
  only:
    - main